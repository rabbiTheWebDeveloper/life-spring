name: linked-issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - name: PR is linked to an issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { repository } = await github.graphql(
              `query($owner:String!,$repo:String!,$pr:Int!){
                 repository(owner:$owner,name:$repo){
                   pullRequest(number:$pr){ closingIssuesReferences(first:1){ totalCount } }
                 }
               }`,
              { owner: context.repo.owner, repo: context.repo.repo, pr: context.issue.number },
            );
            const n = repository.pullRequest.closingIssuesReferences.totalCount;
            if (n === 0) {
              core.setFailed(
                `PR #${context.issue.number} is not linked to an issue. Link it with a branch ` +
                `created from the issue, 'Closes #<n>' in the PR body, or the Development box, ` +
                `then re-run this check.`,
              );
              return;
            }
            core.info(`Linked issues: ${n}`);
